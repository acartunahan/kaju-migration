version: 2
updates:
  - package-ecosystem: maven
    directory: /depo-modernizasyon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "org.mockito*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
