# =====================================================================================
# depo-migration ayarları
#
# Bağlantı adresleri, kullanıcılar ve şifreler SADECE ortam değişkeninden okunur;
# varsayılan değerleri yoktur. Eksikse uygulama başlamaz.
#   HEDEF_DB_URL, HEDEF_DB_KULLANICI, HEDEF_DB_SIFRE
#   LEGACY_DB_URL, LEGACY_DB_KULLANICI, LEGACY_DB_SIFRE
#
# Mod ve etiket komut satırından da verilebilir:
#   --migration.mod=GERCEK --migration.etiket=2026-11-10-1
# =====================================================================================

spring:
  application:
    name: depo-migration
  main:
    web-application-type: none

  # Hedef veritabanı (yeni şema). JPA, Flyway ve Spring Batch bunu kullanır.
  datasource:
    url: ${HEDEF_DB_URL}
    username: ${HEDEF_DB_KULLANICI}
    password: ${HEDEF_DB_SIFRE}
    hikari:
      pool-name: hedef
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        # LocalDateTime doğrudan JDBC ile bağlansın (Timestamp dönüşümü ve JVM saat dilimi devre dışı, K6).
        type:
          java_time_use_direct_jdbc: true
        # Hibernate, Oracle'da toplu HQL update/delete için her entity'ye HTE_<TABLO> global temporary
        # table'ı açılışta kendisi oluşturur. Şema sadece Flyway ile yönetilir (ddl-auto=validate);
        # entity'lerde kalıtım ve toplu HQL mutasyonu yok, bu tablolara ihtiyaç yok.
        query:
          mutation_strategy:
            global_temporary:
              create_tables: false
              drop_tables: false

  flyway:
    enabled: true
    # İki bağımsız script akışı var: domain V1-V999 (depo-domain), göç V1000+ (bu modül).
    # Göç tabloları kurulduktan sonra eklenen bir domain script'i (ör. V2) sürüm olarak 1001'den
    # küçük kalır; out-of-order kapalıysa Flyway "resolved migration not applied" diye durur.
    out-of-order: true
    locations:
      - classpath:db/migration/domain
      - classpath:db/migration/goc

  batch:
    job:
      enabled: false              # Job'ı GocCalistirici başlatır
    jdbc:
      initialize-schema: never    # BATCH_* tabloları Flyway V1001 ile kurulur

migration:
  mod: KURU                       # İlk çalıştırma her zaman KURU olmalı (K10)
  etiket: "1"
  chunk-boyutu: 500
  rapor-klasoru: ./raporlar

  legacy:
    url: ${LEGACY_DB_URL}
    kullanici: ${LEGACY_DB_KULLANICI}
    sifre: ${LEGACY_DB_SIFRE}
    sema: DEPO
    fetch-boyutu: 500
    yazma-yetkisi-varsa: DURDUR   # DURDUR | UYAR

  # Legacy kod → hedef değer. Anahtarlar köşeli parantez içinde (Spring'in özel karakter
  # kuralı). Büyük/küçük harfe duyarlı. Sağdaki boşluklar silinmiş hali yazılır.
  # Listede olmayan değer gelirse satır reddedilir ve raporun 3. bölümünde listelenir.
  # Varsayılanlar DDL comment'lerinden (Aşama 2, 4.3).
  kod-esleme:
    alim-yolu:                    # R_DEMIRBAS.ALIM_YOLU
      "[0]": BILGI_ISLEM_DB
      "[1]": IKMAL_BAKIM_DB
      "[2]": HABERLESME_DB
      "[3]": HABERALMA_OD
      "[4]": KAYNAGI_BELIRSIZ
    demirbas-durumu:              # R_DEMIRBAS.DURUM
      "[1]": NORMAL
      "[2]": ARIZALI
    ariza-islem-turu:             # R_ARIZA_LOG.TUR
      "[1]": ISLEM
      "[2]": BILGI
      "[3]": SIKAYET
      "[4]": TESEKKUR
    sayim-kapsami:                # R_SAYIM.TUR
      "[Y]": YEREL
      "[G]": GENEL
    sayim-durumu:                 # R_SAYIM.DURUM
      "[0]": DEVAM_EDIYOR
      "[1]": TAMAMLANDI
    yerel-sayim-islemi:           # R_SAYIM_YEREL.ISLEM
      "[0]": SAYILMADI
      "[1]": SAYILDI
      "[2]": ZIMMET_DUZELTME
      "[3]": REZERVE
    yerel-sayim-turu:             # R_SAYIM_YEREL.TUR
      "[Z]": ZIMMET
      "[S]": SARF
    genel-sayim-islemi:           # R_SAYIM_GENEL.ISLEM
      "[0]": SAYILMADI
      "[1]": SAYILDI
      "[2]": DUZELTME
    sarf-zimmet-islemi:           # SARF_LOG.ISLEM
      "[ZİMMET]": ZIMMET
      "[DÜŞÜM]": DUSUM
    barkod-seri-mi:               # R_BARKOD.SERIMI
      "[H]": "false"
      "[E]": "true"
    sarf-aktif:                   # SARF_MARKA.AKTIF, SARF_MODEL.AKTIF
      "[0]": "false"
      "[1]": "true"

logging:
  level:
    tr.depo: INFO
